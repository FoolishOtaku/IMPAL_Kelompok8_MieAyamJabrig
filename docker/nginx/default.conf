server {
    listen 80;
    server_name _;

    # Re-resolve `app` via Docker DNS so a recreated/rebuilt app container never
    # leaves Nginx pointing at a stale IP (no manual `restart web` needed).
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $php_upstream app:9000;

    root /var/www/html/public;
    index index.php;

    # Matches PHP upload_max_filesize (max 50 MB per file)
    client_max_body_size 50M;

    # User uploads live on the shared storage volume (no storage:link needed here)
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
