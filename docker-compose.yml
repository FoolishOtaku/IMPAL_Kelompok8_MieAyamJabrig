services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      AUTO_MIGRATE: ${AUTO_MIGRATE:-false}
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-lms}
      DB_USERNAME: ${DB_USERNAME:-lms}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing - run setup.sh (or setup.ps1) first}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${STORAGE_PATH:-lms_storage}:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "pgrep php-fpm > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks: [lms]

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - app
    volumes:
      - ${STORAGE_PATH:-lms_storage}:/var/www/html/storage:ro
    networks: [lms]

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-lms}
      MARIADB_USER: ${DB_USERNAME:-lms}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD missing - run setup.sh (or setup.ps1) first}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD missing - run setup.sh (or setup.ps1) first}
      TZ: Asia/Jakarta
    volumes:
      - ${DB_DATA_PATH:-lms_db_data}:/var/lib/mysql
      - ./docker/mariadb/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [lms]   # no published port: reachable only inside Docker

networks:
  lms: {}

volumes:
  lms_storage: {}
  lms_db_data: {}
